# Relief on the old textures: the textures that get a soft relief made from their own
# brightness in the enhanced picture - the light tops of cobbles, the dark joints of a
# brick wall, the cracks of bark - where they have no normal map of their own. Settings:
# "Relief on old textures" (OMSI_NO_RELIEF=1 leaves it out for A/B runs).
#
# This is the global list, openOMSI writes it with its defaults when it is missing
# (delete it to get them back). A map can have its own beside its global.cfg
# (maps/<map>/relief.cfg): its rules come after these.
#
# One rule per line, a part of a name (case does not matter):
#   pflaster                 a texture whose file name has "pflaster" in it gets relief
#   !schild                  ... "schild": not
#   object:kirche            every texture of an object whose path has "kirche" in it
#   !object:bushaltestelle   none of that object's textures
# The last rule matching a texture decides; a texture no rule matches gets none.
#
# OMSI_DEBUG_RELIEF=1 lists every texture taken in the log.

# cobbles and setts, paving
pflaster
kopfstein
cobble
sett
paving
pave
gehweg
platten
# brick, stone and rough walls
brick
ziegel
klinker
backstein
mauer
stonewall
naturstein
sandstein
bruchstein
granit
stone
stein
fels
rock
# bark and wood
bark
rinde
stamm
trunk
# gravel and ballast
gravel
schotter
kies
# not: signs, glass, the fronts of shops, painted plaster, things with text on them
!schild
!sign
!glas
!glass
!fenster
!window
!werbung
!plakat
!poster
!logo
!steinway
!steiner
!stein_schild
