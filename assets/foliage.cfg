# Plants in the wind: the textures of the leaves, needles, grass and flowers that move in
# the wind. A [tree] (the cards most of OMSI's trees are) always sways; a modelled plant
# sways when one of its see-through textures ([matl_alpha] 1 or 2) is taken by these rules:
# then the whole object bends with the wind, its trunk and stems included, and the
# textures taken here flutter on top of that. An opaque texture is never taken, whatever
# its name.
#
# This is the global list, openOMSI writes it with its defaults when it is missing
# (delete it to get them back). A map can have its own beside its global.cfg
# (maps/<map>/foliage.cfg): its rules come after these.
#
# One rule per line, a part of a name (case does not matter):
#   laub                     a texture whose file name has "laub" in it is foliage
#   !baumarkt                ... "baumarkt": not
#   object:trees_mc          every texture of an object whose path (its folders or its
#                            .sco file's name) has "trees_mc" in it
#   !object:fassade          none of that object's textures
# The last rule matching a texture decides; a texture no rule matches is not foliage.
#
# OMSI_DEBUG_FOLIAGE=1 lists every object taken as a plant in the log.

# leaves, needles, branches
leaf
leaves
laub
blatt
foliage
branch
zweig
nadel
