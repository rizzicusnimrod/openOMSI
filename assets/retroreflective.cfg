# Retroreflective sheeting (Enhanced graphics): the textures that send a headlamp's
# light back the way it came, as a traffic sign's face, a delineator's reflector or a
# chevron board do - they blaze up in the headlamps of the car they are seen from and
# are plain paint to everyone else. Nothing in OMSI's files says which textures those
# are; their names do, and these rules say which names.
#
# This is the global list, openOMSI writes it with its defaults when it is missing
# (delete it to get them back). A map can have its own beside its global.cfg
# (maps/<map>/retroreflective.cfg): its rules come after these.
#
# One rule per line, a part of a name (case does not matter):
#   zeichen                  a texture whose file name has "zeichen" in it is sheeting
#   !werbung                 ... "werbung": paint
#   object:verkehrszeichen   every texture of an object whose path (its folders or its
#                            .sco file's name) has "verkehrszeichen" in it
#   !object:schaufenster     none of that object's textures
# The last rule matching a texture decides; a texture no rule matches is paint.
# Of a texture taken as sheeting only the white and coloured parts shine back: the grey
# of a sign's back or its pole in the same picture stays paint. Where the texture has a
# night map that comes on with the dark (its copy in a `night` folder, a [matl_nightmap]),
# the parts that one lights are a reflector, as a delineator's (brighter than sheeting,
# and seen from higher over the lamps) - it is the old stand-in for the reflection, and
# is not drawn itself. (A night map a variable switches is a lamp's and stays.)
# Never sheeting whatever the rules say: route arrows ([helparrow]) and what is laid on
# the ground ([rendertype] surface / on_surface: paint on the road).
#
# OMSI_DEBUG_RETRO=1 paints the sheeting magenta and lists it in the log.

# traffic signs, town and direction signs, kilometre boards, bus stop signs
zeichen
schilder
ortsschild
ortstafel
ortseingang
ortsausgang
richtungs
wegweis
kilometertafel
hst-schild
haltestellenschild
sign_
roadsign
trafficsign
andreaskreuz

# delineator posts and their reflectors, beacons, chevron boards
leitpf
reflektor
reflector
bake
pfeil

# everything in a traffic signs' folder
object:verkehrszeichen

# paint: shop signs, notice boards, posters, price tags, road markings, hiking trail
# signs, the traffic lights and poles in the signs' folders - and the sign boxes lit from
# inside (a zebra crossing's FGU_Kasten), whose night map is their own light
!wanderweg
!kasten
!werbung
!reklame
!preis
!infotafel
!anschlag
!markier
!design
!firm
!plakat
!ampel
!mast
