# Grass on the ground: the ground textures ([groundtex] of a map's global.cfg, the first
# one being the ground everything starts as) on which grass grows in the enhanced picture,
# swaying in the wind and fading out with the distance. Settings: "Grass" (Off, Sparse,
# Normal, Dense; OMSI_NO_GRASS=1 leaves it out for A/B runs).
#
# This is the global list, openOMSI writes it with its defaults when it is missing
# (delete it to get them back). A map can have its own beside its global.cfg
# (maps/<map>/grass.cfg): its rules come after these.
#
# One rule per line, a part of a texture's file name (case does not matter):
#   wiese                    a ground texture whose name has "wiese" in it grows grass
#   !kunstrasen              ... "kunstrasen": not
# The last rule matching a texture decides; a texture no rule matches grows none.
#
# OMSI_DEBUG_GRASS=1 logs which ground textures grow grass and how much is drawn.

gras
grass
wiese
rasen
meadow
lawn
weide
pasture
verge
boeschung
böschung
# not: artificial turf, gravel lawns, sand, dirt, fields under the plough
!kunstrasen
!astroturf
!schotterrasen
!rasengitter
!sand
!acker
!erde
!dirt
!mud
